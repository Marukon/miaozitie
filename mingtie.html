<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姓名贴 - 喵字帖</title>
    <link rel="stylesheet" href="common.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .control-panel {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .options-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-item label {
            margin: 0;
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }

        .option-item input[type="text"] {
            width: 150px;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .option-item input[type="number"] {
            width: 80px;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .option-item input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            flex: 1;
            min-width: 150px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-print {
            background: #fd7e14;
            color: white;
        }

        .btn-print:hover {
            background: #e8590c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(253, 126, 20, 0.4);
        }

        .preview-area {
            padding: 30px;
            min-height: 400px;
            background: #e9ecef;
            display: flex;
            justify-content: center;
        }

        .a4-page {
            width: 210mm;
            min-height: 297mm;
            background: white;
            padding: 12mm;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: repeat(var(--cols, 3), var(--sticker-w, 55mm));
            grid-auto-rows: var(--sticker-h, 40mm);
            gap: 6mm 8mm;
            align-content: start;
            justify-content: center;
        }

        .sticker {
            border: 2px solid #333;
            border-radius: var(--sticker-radius, 8px);
            padding: var(--sticker-py, 4mm) var(--sticker-px, 5mm);
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            background: white;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        
        .sticker::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid #777;
            border-radius: calc(var(--sticker-radius, 8px) - 2px);
            pointer-events: none;
        }

        .sticker.border-single::after { display: none; }

        .sticker.border-none {
            border-color: transparent;
        }
        .sticker.border-none::after { display: none; }

        .sticker-row {
            display: flex;
            align-items: flex-end;
            font-family: "KaiTi", "楷体", STKaiti, serif;
            font-size: var(--sticker-font, 15pt);
        }

        .sticker-label {
            white-space: nowrap;
            color: #111;
        }

        .sticker-value {
            flex: 1;
            border-bottom: 1.5px solid #333;
            text-align: center;
            color: #000;
            padding: 0 2px 2px 2px;
            min-width: 20px;
            line-height: 1.2;
            word-break: keep-all;
        }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border-radius: 0; max-width: 100%; margin: 0; }
            .control-panel { display: none; }
            .preview-area { padding: 0; background: none; display: flex; justify-content: flex-start; }
            .a4-page { 
                width: 210mm; 
                min-height: 297mm; 
                box-shadow: none; 
                padding: 12mm; 
                margin: 0; 
                page-break-after: always;
            }
            @page { 
                size: A4 portrait; 
                margin: 0mm; 
            }
        }
        
        /* 小屏幕适配 */
        @media (max-width: 768px) {
            .a4-page {
                width: 100%;
                grid-template-columns: repeat(auto-fill, minmax(var(--sticker-w, 55mm), 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-link">← 返回首页</a>
            <h1>🏷️ 姓名贴生成器</h1>
            <p>输入班级、姓名、学号，一键生成A4打印版姓名贴</p>
        </div>

        <div class="control-panel">
            <div class="options-group">
                <div class="option-item">
                    <label for="inputClass">班级：</label>
                    <input type="text" id="inputClass" placeholder="一（2）班">
                </div>
                <div class="option-item">
                    <label for="inputName">姓名：</label>
                    <input type="text" id="inputName" placeholder="李修远">
                </div>
                <div class="option-item">
                    <label for="inputId">学号：</label>
                    <input type="text" id="inputId" placeholder="7">
                </div>
                <div class="option-item">
                    <label for="inputWidth">贴纸宽：</label>
                    <input type="number" id="inputWidth" value="55" min="20" max="90">
                    <span style="font-size: 14px; color: #666;">mm</span>
                </div>
                <div class="option-item">
                    <label for="inputHeight">贴纸高：</label>
                    <input type="number" id="inputHeight" value="40" min="15" max="80">
                    <span style="font-size: 14px; color: #666;">mm</span>
                </div>
                <div class="option-item">
                    <label for="inputCount">打印数量：</label>
                    <input type="number" id="inputCount" value="21" min="1" max="200">
                    <span id="pageHint" style="font-size: 14px; color: #666;">（一页21张，3列×7行）</span>
                </div>
                <div class="option-item">
                    <label>边框：</label>
                    <select id="borderStyle" onchange="generateStickers()" style="padding:10px 12px;border:2px solid #ddd;border-radius:8px;font-size:16px;">
                        <option value="double">双线框</option>
                        <option value="single">单线框</option>
                        <option value="none">无边框</option>
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="generateStickers()">生成姓名贴</button>
                <button class="btn-print" onclick="window.print()">打印姓名贴</button>
            </div>
        </div>

        <div class="preview-area">
            <div class="a4-page" id="stickerContainer">
                <!-- 生成的姓名贴会显示在这里 -->
            </div>
        </div>

        <footer class="footer">
            <p>
                <a href="https://github.com/caicaicai/miaozitie" target="_blank" rel="noopener noreferrer">GitHub 开源</a>
                &nbsp;|&nbsp; MIT License · 一键生成A4打印版姓名贴
            </p>
        </footer>
    </div>

    <script>
        const PAGE_CONTENT_W = 186; // 210mm - 12mm*2 padding
        const PAGE_CONTENT_H = 273; // 297mm - 12mm*2 padding
        const GAP_X = 8;  // mm
        const GAP_Y = 6;  // mm

        function calcLayout(w, h) {
            let cols = 1;
            while ((cols + 1) * w + cols * GAP_X <= PAGE_CONTENT_W) cols++;
            let rows = 1;
            while ((rows + 1) * h + rows * GAP_Y <= PAGE_CONTENT_H) rows++;
            return { cols, rows, perPage: cols * rows };
        }

        function updateHint() {
            const w = parseInt(document.getElementById('inputWidth').value) || 55;
            const h = parseInt(document.getElementById('inputHeight').value) || 40;
            const { cols, rows, perPage } = calcLayout(w, h);
            document.getElementById('pageHint').textContent =
                `（一页${perPage}张，${cols}列×${rows}行）`;
            document.getElementById('inputCount').value = perPage;
        }

        function generateStickers() {
            const stuClass = document.getElementById('inputClass').value.trim() || null;
            const stuName = document.getElementById('inputName').value.trim() || null;
            const stuId = document.getElementById('inputId').value.trim() || null;
            const w = parseInt(document.getElementById('inputWidth').value) || 55;
            const h = parseInt(document.getElementById('inputHeight').value) || 40;
            let count = parseInt(document.getElementById('inputCount').value);
            const { cols } = calcLayout(w, h);

            if (isNaN(count) || count < 1) count = cols * 7;

            const container = document.getElementById('stickerContainer');
            container.style.setProperty('--sticker-w', w + 'mm');
            container.style.setProperty('--sticker-h', h + 'mm');
            container.style.setProperty('--cols', cols);

            const scaleW = w / 55;
            const scaleH = h / 40;
            const scale = Math.min(scaleW, scaleH);
            container.style.setProperty('--sticker-font', (15 * scale).toFixed(1) + 'pt');
            container.style.setProperty('--sticker-px', (5 * scaleW).toFixed(1) + 'mm');
            container.style.setProperty('--sticker-py', (4 * scaleH).toFixed(1) + 'mm');
            container.style.setProperty('--sticker-radius', Math.max(2, 8 * scale).toFixed(0) + 'px');

            container.innerHTML = '';

            const borderVal = document.getElementById('borderStyle').value;
            const borderCls = borderVal === 'single' ? ' border-single' : borderVal === 'none' ? ' border-none' : '';
            const blank = '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
            for (let i = 0; i < count; i++) {
                const sticker = document.createElement('div');
                sticker.className = 'sticker' + borderCls;
                sticker.innerHTML = `
                    <div class="sticker-row">
                        <span class="sticker-label">班级：</span>
                        <span class="sticker-value">${stuClass || blank}</span>
                    </div>
                    <div class="sticker-row">
                        <span class="sticker-label">姓名：</span>
                        <span class="sticker-value">${stuName || blank}</span>
                    </div>
                    <div class="sticker-row">
                        <span class="sticker-label">学号：</span>
                        <span class="sticker-value">${stuId || blank}</span>
                    </div>
                `;
                container.appendChild(sticker);
            }
        }

        window.onload = () => {
            document.getElementById('inputClass').value = '一（2）班';
            document.getElementById('inputName').value = '蔡孝妍';
            document.getElementById('inputId').value = '23';
            updateHint();
            generateStickers();

            document.getElementById('inputWidth').addEventListener('change', () => { updateHint(); generateStickers(); });
            document.getElementById('inputHeight').addEventListener('change', () => { updateHint(); generateStickers(); });
        };
    </script>
</body>
</html>
